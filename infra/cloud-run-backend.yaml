apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: bwevent-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        # When migrating to Cloud SQL, add:
        # run.googleapis.com/cloudsql-instances: PROJECT:europe-west1:INSTANCE
    spec:
      serviceAccountName: bwevent-backend@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: europe-west1-docker.pkg.dev/PROJECT_ID/bwevent/backend:IMAGE_TAG
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # DB config — local Docker uses plain values; Cloud SQL migration:
            # Change DB_HOST to /cloudsql/PROJECT:europe-west1:INSTANCE
            # and mount the Cloud SQL socket via the annotation above.
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: bwevent-db-host
                  key: latest
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: bwevent-db-name
                  key: latest
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: bwevent-db-user
                  key: latest
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bwevent-db-password
                  key: latest
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bwevent-jwt-secret
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
