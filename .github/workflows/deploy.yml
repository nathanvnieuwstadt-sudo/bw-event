name: Deploy to Cloud Run

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push backend
        run: |
          docker build --platform linux/amd64 \
            -t europe-west1-docker.pkg.dev/bw-event-499612/bwevent/backend:${{ github.sha }} \
            ./backend
          docker push europe-west1-docker.pkg.dev/bw-event-499612/bwevent/backend:${{ github.sha }}

      - name: Build and push frontend
        run: |
          docker build --platform linux/amd64 \
            --build-arg VITE_API_BASE_URL=https://bwevent-backend-806738769373.europe-west1.run.app \
            -t europe-west1-docker.pkg.dev/bw-event-499612/bwevent/frontend:${{ github.sha }} \
            ./frontend
          docker push europe-west1-docker.pkg.dev/bw-event-499612/bwevent/frontend:${{ github.sha }}

      - name: Deploy backend
        run: |
          gcloud run deploy bwevent-backend \
            --image=europe-west1-docker.pkg.dev/bw-event-499612/bwevent/backend:${{ github.sha }} \
            --region=europe-west1 \
            --platform=managed \
            --service-account=bwevent-backend@bw-event-499612.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --add-cloudsql-instances=bw-event-499612:europe-west1:bwevent-db \
            --set-secrets=DB_NAME=bwevent-db-name:latest,DB_USER=bwevent-db-user:latest,DB_PASSWORD=bwevent-db-password:latest,JWT_SECRET=bwevent-jwt-secret:latest \
            --set-env-vars=SPRING_PROFILES_ACTIVE=prod \
            --min-instances=1 \
            --memory=512Mi \
            --project=bw-event-499612

      - name: Deploy frontend
        run: |
          gcloud run deploy bwevent-frontend \
            --image=europe-west1-docker.pkg.dev/bw-event-499612/bwevent/frontend:${{ github.sha }} \
            --region=europe-west1 \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --min-instances=1 \
            --memory=256Mi \
            --project=bw-event-499612
