spring:
  application:
    name: bwevent-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bwevent}
    username: ${DB_USER:bwevent}
    password: ${DB_PASSWORD:bwevent_local}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  # All optional — the agent falls back to the mock draft generator without a
  # Claude key, and Gmail ingestion simply stays disconnected without OAuth
  # credentials configured.
  claude:
    api-key: ${CLAUDE_API_KEY:}
  gmail:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
  token-encryption-key: ${TOKEN_ENCRYPTION_KEY:}
  cron:
    secret: ${CRON_SECRET:}

server:
  port: 8080
  servlet:
    context-path: /api/v1
