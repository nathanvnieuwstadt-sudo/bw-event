services:
  postgres:
    image: postgres:16-alpine
    container_name: bwevent-postgres
    environment:
      POSTGRES_DB: bwevent
      POSTGRES_USER: bwevent
      POSTGRES_PASSWORD: bwevent_local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bwevent -d bwevent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bwevent-backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bwevent
      DB_USER: bwevent
      DB_PASSWORD: bwevent_local
      JWT_SECRET: local-dev-secret-change-in-production-must-be-32-chars-min
      JWT_EXPIRATION_MS: 86400000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: bwevent-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
